[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-citeit"
description = "A Django app for the creation of an annotated bibliography."
readme = "README.md"
version = "6.0.0"
keywords=['django', 'annotated', 'bibliography']
requires-python = ">=3.12"
license = { text = "LICENSE" }
authors = [
  {name = "University of North Texas Libraries", email = "mark.phillips@unt.edu"}
]
classifiers = [
    "Natural Language :: English",
    "Environment :: Web Environment",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/unt-libraries/django-citeit"
Repository = "https://github.com/unt-libraries/django-citeit.git"

[project.optional-dependencies]
dev = [
    "Django @ git+https://github.com/django/django.git@stable/6.1.x",
]
test = [
    "pytest~=8.4.0",
    "pytest-django~=4.5.2",
    "factory_boy>=3.0",
    "ruff~=0.15.9",
    "tox==4.28.1",
]

[tool.ruff]
line-length = 99
target-version = "py39"
extend-exclude = ['migrations']

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings.test"
addopts = ["--nomigrations", "--create-db"]

[tool.tox]
legacy_tox_ini = """
    [tox]
    envlist =
        py{312,313,314}-django60
        ruff

    [pytest]
    DJANGO_SETTINGS_MODULE = tests.settings.test

    [testenv]
    extras =
        test
        dev
    commands = 
        pytest
    allowlist_externals = pytest

    [testenv:ruff]
    basepython = python3.12
    deps =
        ruff
    commands =
        ruff check citeIt/ tests/
"""