name: Test django-citeit

on: [push, pull_request, workflow_dispatch]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install tox
        run: |
          python -m pip install --upgrade pip
          pip install tox
          
      - name: Run all tests
        run: |
          tox